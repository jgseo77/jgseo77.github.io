<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VALIX 다운로드 — 비행 슈팅게임</title>
  <meta name="description" content="9개 스테이지, 9종 거대 보스. 한 손으로 즐기는 종스크롤 탄막 슈팅. 무료 · 인앱결제 없음." />

  <!-- 링크 미리보기 (Reddit / X / 카톡 / Discord) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="HYPERSPEED" />
  <meta property="og:title" content="VALIX — 비행 슈팅게임 : 탄막 슈팅" />
  <meta property="og:description" content="9개 스테이지, 9종 거대 보스. 한 손으로 즐기는 종스크롤 탄막 슈팅. 무료 · 인앱결제 없음." />
  <meta property="og:image" content="https://hyperspeedgames.com/valix/og.jpg" />
  <meta property="og:url" content="https://hyperspeedgames.com/valix/" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- 스토어가 앱을 직접 인식하도록 (Safari 스마트 배너) -->
  <meta name="apple-itunes-app" content="app-id=6772428299" />

  <script>
    // ?s=<소스> 로 유입 채널을 구분한다. 예: /valix/?s=shorts, ?s=reddit, ?s=tiktok
    // → Play 는 referrer(utm) 로, App Store 는 ct 로 넘어가 각 콘솔에서 집계된다.
    (function () {
      var src = (new URLSearchParams(location.search).get('s') || 'web')
                  .replace(/[^a-z0-9_-]/gi, '').slice(0, 30) || 'web';

      var IOS = 'https://apps.apple.com/app/id6772428299'
              + '?ct=' + encodeURIComponent(src) + '&mt=8';
      var PLAY = 'https://play.google.com/store/apps/details?id=com.hyperspeed.valix'
               + '&referrer=' + encodeURIComponent(
                   'utm_source=' + src + '&utm_medium=social&utm_campaign=organic_' + src);

      var ua = navigator.userAgent;
      // iPadOS 13+ 는 UA 가 Macintosh 로 나오므로 터치 지원으로 가려낸다.
      var isIOS = /iPad|iPhone|iPod/.test(ua)
               || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/.test(ua);

      window.__STORE = { ios: IOS, play: PLAY };
      if (isIOS)          location.replace(IOS);
      else if (isAndroid) location.replace(PLAY);
      // 그 외(데스크톱)는 아래 선택 화면을 그대로 보여준다.
    })();
  </script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         background:#0a0e1a;color:#e8ecf5;min-height:100vh;display:flex;
         align-items:center;justify-content:center;padding:32px 20px;line-height:1.6}
    .wrap{max-width:520px;width:100%;text-align:center}
    .shot{width:100%;border-radius:14px;border:1px solid #24304f;display:block;margin-bottom:28px}
    h1{font-size:2rem;letter-spacing:.06em;font-weight:800}
    .tag{color:#7fa8ff;margin-top:10px;font-size:1rem}
    ul{list-style:none;margin:22px 0 28px;color:#a8b3cc;font-size:.95rem}
    li{margin:6px 0}
    li::before{content:'▪';color:#4f7cff;margin-right:8px}
    .btns{display:flex;flex-direction:column;gap:12px}
    a.btn{background:#4f7cff;color:#fff;text-decoration:none;padding:15px 24px;
          border-radius:10px;font-weight:700;font-size:1.02rem;display:block}
    a.btn.alt{background:#131a30;border:1px solid #2b3859}
    footer{margin-top:30px;color:#6b7799;font-size:.82rem}
    footer a{color:#7fa8ff}
  </style>
</head>
<body>
  <div class="wrap">
    <img class="shot" src="og.jpg" alt="VALIX 보스전 스크린샷" />
    <h1>VALIX</h1>
    <p class="tag">지구 최후의 방어선</p>
    <ul>
      <li>9개 스테이지 · 9종 거대 보스</li>
      <li>쏟아지는 탄막을 한 손으로</li>
      <li>무료 · 인앱결제 없음 · 오프라인 플레이</li>
    </ul>
    <div class="btns">
      <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.hyperspeed.valix">Google Play (Android)</a>
      <a class="btn alt" id="ios" href="https://apps.apple.com/app/id6772428299">App Store (iPhone / iPad)</a>
    </div>
    <footer>© 2026 <a href="/">HYPERSPEED</a></footer>
  </div>
  <script>
    // JS 가 돌면 버튼에도 유입 소스 태그를 붙인다(위 href 는 무-JS 폴백).
    if (window.__STORE) {
      document.getElementById('play').href = window.__STORE.play;
      document.getElementById('ios').href  = window.__STORE.ios;
    }
  </script>
</body>
</html>
